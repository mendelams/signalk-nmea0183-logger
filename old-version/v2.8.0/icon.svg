<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Compass ring -->
  <circle cx="256" cy="240" r="160" fill="none" stroke="#4fc3f7" stroke-width="4" opacity="0.3"/>
  <circle cx="256" cy="240" r="140" fill="none" stroke="#4fc3f7" stroke-width="2" opacity="0.2"/>
  <!-- Cardinal ticks -->
  <line x1="256" y1="84" x2="256" y2="104" stroke="#4fc3f7" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="376" x2="256" y2="396" stroke="#4fc3f7" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="100" y1="240" x2="120" y2="240" stroke="#4fc3f7" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="392" y1="240" x2="412" y2="240" stroke="#4fc3f7" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <!-- Track line (sailing route) -->
  <path d="M150 340 Q180 280 200 250 Q230 200 270 180 Q320 155 370 170" 
        fill="none" stroke="#66bb6a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- Track dots -->
  <circle cx="150" cy="340" r="6" fill="#66bb6a"/>
  <circle cx="370" cy="170" r="6" fill="#66bb6a"/>
  <!-- Compass needle N -->
  <polygon points="256,120 248,200 264,200" fill="#ef5350" opacity="0.9"/>
  <!-- Compass needle S -->
  <polygon points="256,360 248,280 264,280" fill="#ffffff" opacity="0.3"/>
  <!-- Center dot -->
  <circle cx="256" cy="240" r="8" fill="#4fc3f7"/>
  <!-- "LOG" text -->
  <text x="256" y="460" text-anchor="middle" font-family="system-ui,sans-serif" font-size="48" font-weight="700" fill="#4fc3f7" letter-spacing="8">LOG</text>
</svg>
