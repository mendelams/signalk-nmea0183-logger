<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NMEA0183 Log Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1d23;color:#e0e0e0;padding:20px}
h1{font-size:1.4em;margin-bottom:6px;color:#4fc3f7}
.subtitle{color:#888;font-size:.85em;margin-bottom:20px}
.stats-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.stat-chip{background:#2a2d35;border:1px solid #3a3d45;border-radius:6px;padding:4px 10px;font-size:.8em;color:#aaa}
.stat-chip .count{color:#4fc3f7;font-weight:600}
.panel{background:#22252b;border:1px solid #333;border-radius:8px;margin-bottom:20px;overflow:hidden}
.panel-header{background:#2a2d35;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.panel-header h2{font-size:1em;color:#ccc}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 16px;background:#2a2d35;color:#888;font-size:.8em;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #333}
td{padding:10px 16px;border-bottom:1px solid #2a2d35;font-size:.9em}
tr:hover{background:#2a2d35}
.file-link{color:#4fc3f7;text-decoration:none;cursor:pointer}
.file-link:hover{text-decoration:underline}
.size{color:#888}
.btn{display:inline-block;padding:5px 12px;border-radius:4px;border:1px solid #444;background:#2a2d35;color:#ccc;font-size:.8em;cursor:pointer;text-decoration:none}
.btn:hover{background:#3a3d45;color:#fff}
.btn-primary{border-color:#4fc3f7;color:#4fc3f7}
.btn-primary:hover{background:#4fc3f7;color:#1a1d23}
.btn-danger{border-color:#ef5350;color:#ef5350}
.btn-danger:hover{background:#ef5350;color:#fff}
.btn-success{border-color:#66bb6a;color:#66bb6a}
.btn-success:hover{background:#66bb6a;color:#1a1d23}
.btn-group{display:flex;gap:6px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar input,.toolbar select{background:#1a1d23;border:1px solid #444;border-radius:4px;color:#e0e0e0;padding:5px 10px;font-size:.85em}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:#4fc3f7}
.log-viewer{background:#111318;padding:12px 16px;max-height:600px;overflow-y:auto;font-family:'Fira Code',Consolas,Monaco,monospace;font-size:.78em;line-height:1.6;white-space:pre;overflow-x:auto}
.log-line{color:#bbb}
.ts{color:#666}
.ais{color:#ff9800}
.gps{color:#66bb6a}
.depth{color:#42a5f5}
.wind{color:#ab47bc}
.heading{color:#26c6da}
.empty-state{text-align:center;padding:40px;color:#555}
.loading{text-align:center;padding:20px;color:#666}
.back-link{color:#4fc3f7;text-decoration:none;font-size:.85em;margin-bottom:10px;display:inline-block;cursor:pointer}
.back-link:hover{text-decoration:underline}
.live-badge{background:#66bb6a;color:#1a1d23;font-size:.7em;padding:2px 8px;border-radius:10px;font-weight:600;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.info{color:#888;font-size:.8em;padding:8px 16px}
</style>
</head>
<body>
<h1>NMEA0183 Log Viewer</h1>
<p class="subtitle" id="logdir"></p>
<div id="stats-bar" class="stats-bar"></div>
<div id="app"></div>
<script>
// API routes are served at /plugins/signalk-nmea0183-logger/
const API = '/plugins/signalk-nmea0183-logger';
let autoRefresh = null;

async function api(ep) {
  const r = await fetch(API + ep);
  return r.json();
}

function fmtSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function colorize(line) {
  let h = esc(line);
  h = h.replace(/^(\d{4}-\d{2}-\d{2}T[\d:.]+Z)/, '<span class="ts">$1</span>');
  if (/AIVDM|AIVDO/.test(line)) h = h.replace(/(![A-Z]{5})/, '<span class="ais">$1</span>');
  else if (/\$..GGA|\$..RMC|\$..GLL|\$..VTG/.test(line)) h = h.replace(/(\$[A-Z]{5})/, '<span class="gps">$1</span>');
  else if (/\$..DB[TKS]|\$..DPT/.test(line)) h = h.replace(/(\$[A-Z]{5})/, '<span class="depth">$1</span>');
  else if (/\$..MWV|\$..MWD|\$..VWR/.test(line)) h = h.replace(/(\$[A-Z]{5})/, '<span class="wind">$1</span>');
  else if (/\$..HD[GMT]/.test(line)) h = h.replace(/(\$[A-Z]{5})/, '<span class="heading">$1</span>');
  return h;
}

async function loadStats() {
  try {
    const s = await api('/api/stats');
    document.getElementById('logdir').textContent = 'Log directory: ' + s.logDirectory;
    const bar = document.getElementById('stats-bar');
    const e = Object.entries(s.sentenceStats || {}).sort((a, b) => b[1] - a[1]);
    bar.innerHTML = e.length === 0
      ? '<span class="stat-chip">No sentences received yet</span>'
      : e.map(([t, c]) => '<span class="stat-chip">' + t + ' <span class="count">' + c.toLocaleString() + '</span></span>').join('');
  } catch (e) { console.error(e); }
}

async function showList() {
  stopAuto();
  const el = document.getElementById('app');
  el.innerHTML = '<div class="loading">Loading...</div>';
  try {
    const files = await api('/api/logs');
    if (!files.length) {
      el.innerHTML = '<div class="panel"><div class="empty-state">No log files yet. Make sure the plugin is enabled and NMEA0183 data is flowing.</div></div>';
      return;
    }
    const today = new Date().toISOString().split('T')[0];
    let h = '<div class="panel"><div class="panel-header"><h2>Log Files</h2></div><table>';
    h += '<tr><th>Date</th><th>Filename</th><th>Size</th><th>Last Modified</th><th>Actions</th></tr>';
    files.forEach(f => {
      const isToday = f.date === today;
      h += '<tr><td>' + f.date + (isToday ? ' <span class="live-badge">TODAY</span>' : '') + '</td>';
      h += '<td><a class="file-link" onclick="viewFile(\'' + f.name + '\')">' + f.name + '</a></td>';
      h += '<td class="size">' + fmtSize(f.size) + '</td>';
      h += '<td class="size">' + new Date(f.modified).toLocaleString() + '</td>';
      h += '<td><div class="btn-group">';
      h += '<a class="btn btn-primary" onclick="viewFile(\'' + f.name + '\')">View</a>';
      h += '<a class="btn" href="' + API + '/api/logs/' + f.name + '/download">Download</a>';
      h += '<a class="btn btn-danger" onclick="delFile(\'' + f.name + '\')">Delete</a>';
      h += '</div></td></tr>';
    });
    h += '</table></div>';
    el.innerHTML = h;
  } catch (err) {
    el.innerHTML = '<div class="panel"><div class="empty-state">Error: ' + esc(err.message) + '</div></div>';
  }
}

async function viewFile(fn, lines, filter) {
  stopAuto();
  const n = lines || 200, fi = filter || '';
  const el = document.getElementById('app');
  let h = '<a class="back-link" onclick="showList()">&larr; Back to file list</a>';
  h += '<div class="panel"><div class="panel-header"><h2>' + esc(fn) + '</h2>';
  h += '<div class="toolbar">';
  h += '<input type="text" id="fi" placeholder="Filter (e.g. AIVDM, GGA)" value="' + esc(fi) + '" onkeydown="if(event.key===\'Enter\')applyF(\'' + fn + '\')">';
  h += '<select id="ln" onchange="applyF(\'' + fn + '\')">';
  [50, 100, 200, 500, 1000, 0].forEach(v => {
    h += '<option value="' + v + '"' + (v === n ? ' selected' : '') + '>' + (v === 0 ? 'All lines' : 'Last ' + v) + '</option>';
  });
  h += '</select>';
  h += '<button class="btn btn-primary" onclick="applyF(\'' + fn + '\')">Apply</button>';
  h += '<button class="btn" id="ar-btn" onclick="toggleAuto(\'' + fn + '\')">Auto-refresh: OFF</button>';
  h += '<a class="btn" href="' + API + '/api/logs/' + fn + '/download">Download</a>';
  h += '</div></div>';
  h += '<div id="log-info" class="info"></div>';
  h += '<div id="log-content" class="log-viewer"><div class="loading">Loading...</div></div></div>';
  el.innerHTML = h;
  await loadContent(fn, n, fi);
}

async function loadContent(fn, lines, filter) {
  try {
    let u = '/api/logs/' + fn + '?lines=' + (lines || 0);
    if (filter) u += '&filter=' + encodeURIComponent(filter);
    const d = await api(u);
    document.getElementById('log-info').textContent =
      'Showing ' + d.returnedLines.toLocaleString() + ' of ' + d.totalLines.toLocaleString() + ' lines' +
      (d.filter ? ' (filtered: ' + d.filter + ')' : '');
    const c = document.getElementById('log-content');
    if (!d.lines.length) { c.innerHTML = '<div class="empty-state">No matching lines.</div>'; return; }
    c.innerHTML = d.lines.map(l => '<div class="log-line">' + colorize(l) + '</div>').join('');
    c.scrollTop = c.scrollHeight;
  } catch (e) {
    document.getElementById('log-content').innerHTML = '<div class="empty-state">Error: ' + esc(e.message) + '</div>';
  }
}

function applyF(fn) {
  loadContent(fn, parseInt(document.getElementById('ln').value) || 0, document.getElementById('fi').value);
}

function toggleAuto(fn) {
  const btn = document.getElementById('ar-btn');
  if (autoRefresh) {
    stopAuto();
    btn.textContent = 'Auto-refresh: OFF';
    btn.classList.remove('btn-success');
  } else {
    btn.textContent = 'Auto-refresh: ON';
    btn.classList.add('btn-success');
    autoRefresh = setInterval(() => { applyF(fn); loadStats(); }, 3000);
  }
}

function stopAuto() {
  if (autoRefresh) { clearInterval(autoRefresh); autoRefresh = null; }
}

async function delFile(fn) {
  if (!confirm('Delete ' + fn + '?')) return;
  try { await fetch(API + '/api/logs/' + fn, { method: 'DELETE' }); showList(); }
  catch (e) { alert('Error: ' + e.message); }
}

loadStats();
showList();
setInterval(loadStats, 15000);
</script>
</body>
</html>
