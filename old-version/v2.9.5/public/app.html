<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NMEA0183 Logger</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="theme-color" content="#4fc3f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="offline-bar" id="offline-bar">⚡ Offline — cached data</div>
<div class="container">
  <div class="header">
    <h1 id="app-title" onclick="showList()" style="cursor:pointer" title="Back to log list">NMEA0183 Logger</h1>
    <span class="input-badge" id="input-badge"></span>
    <div class="header-right">
      <div class="theme-toggle" onclick="toggleTheme()" title="Day / Night mode">
        <span class="theme-toggle-label">☾</span>
        <div class="theme-toggle-track"><div class="theme-toggle-thumb"></div></div>
        <span class="theme-toggle-label">☀</span>
      </div>
      <span class="gear-btn" onclick="refreshApp()" title="Refresh">⟳</span>
      <span class="gear-btn" onclick="showSettings()" title="Settings">⚙</span>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="print-header" style="display:none"><h2 id="print-title"></h2><div class="print-sub" id="print-sub"></div></div>
  <div id="app"></div>
</div>
<script src="/app.js"></script>
</body>
</html>
