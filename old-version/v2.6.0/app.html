<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NMEA0183 Logger</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="theme-color" content="#4fc3f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#1a1d23;--card:#22252b;--card2:#2a2d35;--border:#333;
  --text:#e0e0e0;--muted:#888;--dim:#555;
  --blue:#4fc3f7;--green:#66bb6a;--orange:#ff9800;--red:#ef5350;--purple:#ab47bc;--cyan:#26c6da;--yellow:#fdd835;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
.container{max-width:900px;margin:0 auto;padding:12px}
.header{display:flex;align-items:center;justify-content:space-between;padding:8px 0;margin-bottom:8px;flex-wrap:wrap;gap:6px}
.header h1{font-size:1.1em;color:var(--blue);white-space:nowrap}
.header-right{display:flex;align-items:center;gap:8px}
.header-sub{color:var(--muted);font-size:.72em}
.lang-switch{background:var(--card2);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:3px 6px;font-size:.72em;cursor:pointer}
.lang-switch:focus{outline:none;border-color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.chip{background:var(--card2);border:1px solid var(--border);border-radius:4px;padding:2px 7px;font-size:.7em;color:var(--muted)}
.chip b{color:var(--blue);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:.78em;cursor:pointer;text-decoration:none;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn-blue{border-color:var(--blue);color:var(--blue)}
.btn-red{border-color:var(--red);color:var(--red)}
.btn-green{border-color:var(--green);color:var(--green)}
.btn-sm{padding:4px 8px;font-size:.72em}
.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;padding:6px 0;margin-bottom:6px}
.topbar-left{display:flex;align-items:center;gap:8px}
.back{color:var(--blue);font-size:.85em;cursor:pointer;text-decoration:none}
.topbar-title{font-size:.9em;font-weight:600}
.topbar-right{display:flex;gap:6px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
.card-title{background:var(--card2);padding:8px 12px;font-size:.8em;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase}
#map{height:45vh;min-height:260px;max-height:500px;width:100%;background:var(--bg)}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border)}
.sg-item{background:var(--card);padding:10px 8px;text-align:center}
.sg-label{font-size:.62em;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;line-height:1.2}
.sg-val{font-size:1.15em;font-weight:700;color:var(--blue);line-height:1.2}
.sg-unit{font-size:.6em;color:var(--muted);margin-left:1px}
.sg-section{grid-column:1/-1;background:var(--card2);padding:4px 10px;font-size:.62em;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
.ev-list{padding:6px 0}
.ev-item{display:flex;gap:8px;padding:5px 12px;font-size:.78em;border-bottom:1px solid #2a2d35}
.ev-item:last-child{border-bottom:none}
.ev-time{color:var(--muted);min-width:44px;font-size:.85em;white-space:nowrap}
.ev-icon{font-size:1em;min-width:20px;text-align:center}
.ev-detail{flex:1}
.ev-type-engine .ev-detail{color:var(--orange)}
.ev-type-course .ev-detail{color:var(--cyan)}
.ev-type-wind .ev-detail{color:var(--purple)}
.ev-type-battery .ev-detail{color:var(--red)}
.wx-table{width:100%;border-collapse:collapse}
.wx-table th{padding:6px 6px;text-align:left;font-size:.6em;color:var(--muted);text-transform:uppercase;letter-spacing:.2px;background:var(--card2);border-bottom:1px solid var(--border);position:sticky;top:0}
.wx-table td{padding:6px 6px;font-size:.75em;border-bottom:1px solid #2a2d35}
.wx-table tr:last-child td{border-bottom:none}
.wx-icon{font-size:1.1em;vertical-align:middle}
.wx-temp{color:var(--orange);font-weight:600}
.wx-wind{color:var(--purple)}
.wx-gust{color:var(--red);font-size:.82em}
.wx-wave{color:var(--cyan)}
.wx-desc{color:var(--muted);font-size:.78em}
.wx-meas{color:var(--green);font-weight:600}
.wx-diff-pos{color:var(--red);font-size:.72em}
.wx-diff-neg{color:var(--blue);font-size:.72em}
.wx-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.wx-note{padding:6px 10px;font-size:.65em;color:var(--dim);font-style:italic}
.wx-loading{padding:16px;text-align:center;color:var(--dim);font-size:.82em}
.nmea-toolbar{display:flex;gap:6px;padding:8px 10px;flex-wrap:wrap;align-items:center;background:var(--card2)}
.nmea-toolbar input,.nmea-toolbar select{background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 8px;font-size:.8em;flex:1;min-width:0}
.nmea-toolbar select{flex:0 0 auto;width:auto}
.nmea-info{padding:4px 10px;font-size:.7em;color:var(--muted)}
.log-view{background:#111318;padding:8px 10px;max-height:50vh;overflow:auto;font-family:'Fira Code',Consolas,monospace;font-size:.7em;line-height:1.55;white-space:pre;-webkit-overflow-scrolling:touch}
.ll{color:#bbb}.ts{color:#555}.ais{color:var(--orange)}.gps{color:var(--green)}.depth{color:#42a5f5}.wind{color:var(--purple)}.hdg{color:var(--cyan)}
.ftable{width:100%;border-collapse:collapse}
.ftable th{text-align:left;padding:8px 10px;font-size:.68em;color:var(--muted);text-transform:uppercase;background:var(--card2);border-bottom:1px solid var(--border)}
.ftable td{padding:8px 10px;font-size:.82em;border-bottom:1px solid #2a2d35}
.flink{color:var(--blue);text-decoration:none;cursor:pointer}
.fsize{color:var(--muted)}
.live{background:var(--green);color:var(--bg);font-size:.62em;padding:1px 6px;border-radius:8px;font-weight:700;margin-left:4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.empty{text-align:center;padding:30px;color:var(--dim)}
.loading{text-align:center;padding:20px;color:var(--dim)}
@media(max-width:480px){
  .container{padding:8px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  #map{height:38vh;min-height:220px}
  .log-view{font-size:.65em;max-height:40vh}
  .ftable td,.ftable th{padding:6px 8px;font-size:.78em}
  .wx-table td,.wx-table th{padding:4px 3px;font-size:.65em}
  .ev-item{font-size:.72em}
}
@media(min-width:600px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:768px){.stats-grid{grid-template-columns:repeat(6,1fr)}}

/* ── Print ──────────────────────────────────── */
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
  body{background:#fff!important;color:#222!important;font-size:10pt}
  .container{max-width:100%;padding:0;margin:0}

  /* Hide interactive / non-printable elements */
  .header,.chips,.back,.btn,.topbar-right,.nmea-toolbar,.log-view,.nmea-info,.lang-switch,.header-right,
  .no-print,#ar-btn,.live{display:none!important}

  /* Print header */
  .print-header{display:block!important;text-align:center;padding:8px 0 4px;border-bottom:2px solid #333;margin-bottom:8px}
  .print-header h2{font-size:14pt;margin:0;color:#222}
  .print-header .print-sub{font-size:9pt;color:#666;margin-top:2px}

  /* Topbar: only show title */
  .topbar{justify-content:center;padding:0;margin:0}
  .topbar-left{gap:0}
  .topbar-title{font-size:11pt;color:#222}

  /* Cards */
  .card{border:1px solid #ccc!important;border-radius:6px;margin-bottom:8px;break-inside:avoid;background:#fff!important}
  .card-title{background:#eee!important;color:#444!important;padding:5px 10px;font-size:8pt}

  /* Stats grid */
  .stats-grid{grid-template-columns:repeat(6,1fr)!important;background:#ccc!important}
  .sg-item{background:#fff!important;padding:6px 4px}
  .sg-label{color:#666!important;font-size:6pt}
  .sg-val{color:#1565c0!important;font-size:10pt}
  .sg-unit{color:#888!important}
  .sg-section{background:#eee!important;color:#666!important;padding:3px 8px;font-size:6pt}

  /* Events */
  .ev-list{padding:2px 0}
  .ev-item{padding:3px 10px;font-size:8pt;border-bottom:1px solid #eee!important}
  .ev-time{color:#666!important}
  .ev-type-engine .ev-detail{color:#e65100!important}
  .ev-type-course .ev-detail{color:#00838f!important}
  .ev-type-wind .ev-detail{color:#7b1fa2!important}
  .ev-type-battery .ev-detail{color:#c62828!important}

  /* Weather table */
  .wx-table th{background:#eee!important;color:#444!important;font-size:6pt;padding:4px 4px}
  .wx-table td{font-size:7.5pt;padding:3px 4px;border-bottom:1px solid #eee!important}
  .wx-temp{color:#e65100!important}
  .wx-wind{color:#7b1fa2!important}
  .wx-gust{color:#c62828!important}
  .wx-wave{color:#00838f!important}
  .wx-meas{color:#2e7d32!important}
  .wx-diff-pos{color:#c62828!important}
  .wx-diff-neg{color:#1565c0!important}
  .wx-note{font-size:6pt;color:#999!important}

  /* Map */
  #map{height:300px!important;min-height:300px!important;max-height:300px!important;break-inside:avoid}
  .leaflet-tile-pane,.leaflet-overlay-pane,.leaflet-marker-pane{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .leaflet-control-zoom,.leaflet-control-layers{display:none!important}

  /* NMEA log section: hide entirely */
  .no-print{display:none!important}

  /* Page setup */
  @page{margin:12mm 10mm;size:A4}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div><h1>NMEA0183 Logger</h1><div class="header-sub" id="logdir"></div></div>
    <div class="header-right">
      <select class="lang-switch" id="lang-select" onchange="switchLang(this.value)"></select>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="print-header" style="display:none"><h2 id="print-title"></h2><div class="print-sub" id="print-sub"></div></div>
  <div id="app"></div>
</div>

<script>
const API_SK=`http://${window.location.hostname}:3000/plugins/signalk-nmea0183-logger`;
let autoRefresh=null,leafletMap=null;

// ── i18n ──────────────────────────────────────────
let T={};        // current translation dict
let curLang='en';
let availLangs=[];
let currentView=null; // {type:'list'} or {type:'detail',fn:'...'}

async function initLang(){
  try{
    const info=await api('/api/lang');
    curLang=info.current||'en';
    availLangs=info.available||[{code:'en',name:'English'}];
    const sel=document.getElementById('lang-select');
    sel.innerHTML=availLangs.map(l=>`<option value="${l.code}"${l.code===curLang?' selected':''}>${l.name}</option>`).join('');
    await loadLang(curLang);
  }catch(e){console.error('Lang init:',e);}
}

async function loadLang(code){
  try{
    T=await api('/api/lang/'+code);
    curLang=code;
  }catch(e){console.error('Lang load:',e);T={};}
}

function switchLang(code){
  loadLang(code).then(()=>{
    if(currentView&&currentView.type==='detail') viewFile(currentView.fn);
    else showList();
  });
}

// Translation helper with fallback and {0},{1} replacement
function t(key,...args){
  let s=T[key]||key;
  args.forEach((a,i)=>{s=s.replace(`{${i}}`,a);});
  return s;
}

const WMO_ICONS={0:'☀️',1:'🌤',2:'⛅',3:'☁️',45:'🌫',48:'🌫',51:'🌦',53:'🌧',55:'🌧',56:'🌧',57:'🌧',61:'🌧',63:'🌧',65:'🌧',66:'🌧',67:'🌧',71:'🌨',73:'🌨',75:'🌨',77:'🌨',80:'🌦',81:'🌧',82:'⛈',85:'🌨',86:'🌨',95:'⛈',96:'⛈',99:'⛈'};
function wmo(c){return [WMO_ICONS[c]||'❓', t('wmo'+c)||('Code '+c)];}

const EVT_ICONS={engine:'⚙️',course:'🧭',wind:'💨',battery:'🔋'};

// ── Helpers ───────────────────────────────────────
async function api(e){
  const r=await fetch(e);
  if(!r.ok){const txt=await r.text().catch(()=>'');throw new Error(`${r.status}: ${txt.substring(0,120)}`);}
  const ct=r.headers.get('content-type')||'';
  if(!ct.includes('json')&&!ct.includes('octet')){const txt=await r.text().catch(()=>'');throw new Error(t('noJson')+': '+txt.substring(0,100));}
  return r.json();
}
const fmtSize=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB';
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtTime=iso=>{if(!iso)return'—';const d=new Date(iso);return d.toLocaleDateString()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});};
const fmtHM=iso=>{if(!iso)return'—';return new Date(iso).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});};
function fmtDur(h){if(h===null||h===undefined)return'—';const hr=Math.floor(h),m=Math.round((h-hr)*60);return hr+t('durH')+'\u2009'+(m<10?'0':'')+m+t('durM');}

function colorize(l){
  let h=esc(l);
  h=h.replace(/^(\d{4}-\d{2}-\d{2}T[\d:.]+Z)/,'<span class="ts">$1</span>');
  if(/AIVDM|AIVDO/.test(l))return h.replace(/(![A-Z]{5})/,'<span class="ais">$1</span>');
  if(/\$..(?:GGA|RMC|GLL|VTG)/.test(l))return h.replace(/(\$[A-Z]{5})/,'<span class="gps">$1</span>');
  if(/\$..DB[TKS]|\$..DPT/.test(l))return h.replace(/(\$[A-Z]{5})/,'<span class="depth">$1</span>');
  if(/\$..(?:MWV|MWD|VWR)/.test(l))return h.replace(/(\$[A-Z]{5})/,'<span class="wind">$1</span>');
  if(/\$..HD[GMT]/.test(l))return h.replace(/(\$[A-Z]{5})/,'<span class="hdg">$1</span>');
  return h;
}

async function loadChips(){
  try{
    const s=await api('/api/stats');
    document.getElementById('logdir').textContent=s.logDirectory||'';
    const el=document.getElementById('chips');
    const e=Object.entries(s.sentenceStats||{}).sort((a,b)=>b[1]-a[1]);
    el.innerHTML=e.length?e.map(([k,c])=>`<span class="chip">${k} <b>${c.toLocaleString()}</b></span>`).join('')
      :`<span class="chip">${t('waitingData')}</span>`;
  }catch(e){console.error(e);}
}

/* ════════════════════════════════════════════════════
   FILE LIST
   ════════════════════════════════════════════════════ */
async function showList(){
  stopAuto();destroyMap();
  currentView={type:'list'};
  const el=document.getElementById('app');
  el.innerHTML=`<div class="loading">${t('loading')}</div>`;
  try{
    const files=await api('/api/logs');
    if(!files.length){el.innerHTML=`<div class="card"><div class="empty">${t('noLogs')}</div></div>`;return;}
    const today=new Date().toISOString().split('T')[0];
    let h=`<div class="card"><table class="ftable"><tr><th>${t('date')}</th><th>${t('size')}</th><th></th></tr>`;
    for(const f of files){
      const isToday=f.date===today;
      h+=`<tr><td><a class="flink" onclick="viewFile('${f.name}')">${f.date}</a>${isToday?'<span class="live">LIVE</span>':''}</td>`;
      h+=`<td class="fsize">${fmtSize(f.size)}</td>`;
      h+=`<td style="text-align:right"><span class="btn btn-blue btn-sm" onclick="viewFile('${f.name}')">${t('view')}</span></td></tr>`;
    }
    h+='</table></div>';
    el.innerHTML=h;
  }catch(e){el.innerHTML=`<div class="card"><div class="empty">${t('errorPrefix')}: ${esc(e.message)}</div></div>`;}
}

/* ════════════════════════════════════════════════════
   DETAIL VIEW
   ════════════════════════════════════════════════════ */
async function viewFile(fn){
  stopAuto();destroyMap();
  currentView={type:'detail',fn};
  const el=document.getElementById('app');
  el.innerHTML=`<div class="loading">${t('analyzing')}</div>`;

  const [stats,logData]=await Promise.all([
    api('/api/logs/'+fn+'/stats').catch(()=>null),
    api('/api/logs/'+fn+'?lines=200').catch(()=>null)
  ]);

  let h='';

  h+=`<div class="topbar">
    <div class="topbar-left"><a class="back" onclick="showList()">← ${t('back')}</a><span class="topbar-title">${stats?stats.filename.replace('nmea0183_','').replace('.log',''):fn}</span></div>
    <div class="topbar-right">
      <span class="btn btn-sm" onclick="printReport()">🖨 Print</span>
      <a class="btn btn-sm" href="/api/logs/${fn}/download">⬇ ${t('download')}</a>
      <span class="btn btn-sm btn-red" onclick="delFile('${fn}')">🗑 ${t('delete')}</span>
    </div>
  </div>`;

  if(stats&&stats.track&&stats.track.length>0){
    h+='<div class="card"><div id="map"></div></div>';
  } else {
    h+=`<div class="card"><div class="empty">${t('noTrack')}</div></div>`;
  }

  if(stats){
    h+='<div class="card"><div class="stats-grid">';
    h+=sgSec(t('navigation'));
    h+=sg(t('distance'),stats.totalDistanceNm,'nm');
    h+=sg(t('duration'),fmtDur(stats.durationHours),'');
    h+=sg(t('sogAvg'),stats.sogAvgKn,'kn');
    h+=sg(t('sogMax'),stats.sogMaxKn,'kn');
    h+=sg(t('start'),fmtHM(stats.startTime),'');
    h+=sg(t('end'),fmtHM(stats.endTime),'');
    h+=sgSec(t('wind'));
    h+=sg(t('twsAvg'),stats.twsAvgKn,'kn');
    h+=sg(t('twsMax'),stats.twsMaxKn,'kn');
    h+=sg(t('twaAvg'),stats.twaAvgDeg,'°');
    h+=sg(t('twaMin'),stats.twaMinDeg,'°');
    h+=sg(t('twaMax'),stats.twaMaxDeg,'°');
    h+=sgSec(t('engine'));
    h+=sg(t('hours'),stats.engineHours>0?fmtDur(stats.engineHours):'—','');
    h+=sg(t('periods'),stats.enginePeriods?stats.enginePeriods.length:0,'');
    h+=sg(t('rpmData'),stats.rpmSamples,'');
    h+='</div></div>';
  }

  if(stats&&stats.events&&stats.events.length>0){
    h+=`<div class="card"><div class="card-title">${t('events')}</div><div class="ev-list">`;
    for(const ev of stats.events){
      const icon=EVT_ICONS[ev.type]||'📌';
      h+=`<div class="ev-item ev-type-${ev.type}">
        <span class="ev-time">${fmtHM(ev.time)}</span>
        <span class="ev-icon">${icon}</span>
        <span class="ev-detail">${esc(ev.detail)}</span>
      </div>`;
    }
    h+='</div></div>';
  }

  h+='<div id="wx-panel"></div>';

  h+=`<div class="card no-print">
    <div class="nmea-toolbar">
      <input type="text" id="fi" placeholder="${t('filterPlaceholder')}" enterkeyhint="search"
        onkeydown="if(event.key==='Enter'){event.preventDefault();applyF('${fn}')}">
      <select id="ln" onchange="applyF('${fn}')">
        <option value="100">100</option><option value="200" selected>200</option>
        <option value="500">500</option><option value="1000">1000</option><option value="0">All</option>
      </select>
      <span class="btn btn-sm btn-blue" onclick="applyF('${fn}')">Filter</span>
      <span class="btn btn-sm" id="ar-btn" onclick="toggleAuto('${fn}')">Auto ✕</span>
    </div>
    <div class="nmea-info" id="log-info"></div>
    <div class="log-view" id="log-content"></div>
  </div>`;

  el.innerHTML=h;
  if(stats&&stats.track&&stats.track.length>0) renderMap(stats.track, stats.events);
  if(logData) renderLog(logData);
  if(stats&&stats.weatherIntervals&&stats.weatherIntervals.length>0&&stats.startTime){
    fetchIntervalWeather(fn);
  }
}

function sg(label,val,unit){
  const display=(val!==null&&val!==undefined)?val:'—';
  return `<div class="sg-item"><div class="sg-label">${label}</div><div class="sg-val">${display}${unit?'<span class="sg-unit">'+unit+'</span>':''}</div></div>`;
}
function sgSec(title){return `<div class="sg-section">${title}</div>`;}

/* ════════════════════════════════════════════════════
   WEATHER + SEA STATE
   ════════════════════════════════════════════════════ */
async function fetchIntervalWeather(fn){
  const panel=document.getElementById('wx-panel');
  if(!panel)return;
  panel.innerHTML=`<div class="card"><div class="wx-loading">${t('fetchingWeather')}</div></div>`;

  let hours;
  try{
    hours=await api('/api/logs/'+fn+'/weather');
  }catch(e){console.error('Weather fetch error:',e);hours=[];}

  if(!hours||!hours.length){panel.innerHTML=`<div class="card"><div class="empty">${t('noWeather')}</div></div>`;return;}

  let html=`<div class="card"><div class="card-title">${t('weatherTitle')}</div><div class="wx-scroll"><table class="wx-table">`;
  html+=`<tr><th>${t('wxHour')}</th><th></th><th>${t('wxWeather')}</th><th>${t('wxTemp')}</th><th>${t('wxWind')}</th><th>${t('wxGusts')}</th><th>${t('wxWave')}</th>`;
  const hasMeasured=hours.some(w=>w.measuredTWS!==null||w.measuredTemp!==null);
  if(hasMeasured) html+=`<th>${t('wxMeasured')}</th><th>${t('wxDelta')}</th>`;
  html+='</tr>';

  for(const w of hours){
    const [icon,desc]=wmo(w.code);
    const timeLabel=String(w.hour).padStart(2,'0')+':00';
    const windDirStr=w.windDir!==null?windArrow(w.windDir):'';
    let waveStr='—';
    if(w.waveH!==null){
      waveStr=`${w.waveH.toFixed(1)}m`;
      if(w.wavePer!==null) waveStr+=` ${w.wavePer.toFixed(0)}s`;
      if(w.waveDir!==null) waveStr+=` ${windArrow(w.waveDir)}`;
    }
    html+=`<tr>
      <td style="white-space:nowrap">${timeLabel}</td>
      <td><span class="wx-icon">${icon}</span></td>
      <td><span class="wx-desc">${desc}</span></td>
      <td class="wx-temp">${w.temp!==null?w.temp.toFixed(1)+'°':'—'}</td>
      <td class="wx-wind">${w.wind!==null?Math.round(w.wind)+'kn '+windDirStr:'—'}</td>
      <td class="wx-gust">${w.gust!==null&&w.gust>0?Math.round(w.gust)+'kn':'—'}</td>
      <td class="wx-wave">${waveStr}</td>`;
    if(hasMeasured){
      let measStr='';
      if(w.measuredTWS!==null) measStr+=`${w.measuredTWS.toFixed(1)}kn`;
      if(w.measuredTemp!==null) measStr+=(measStr?' · ':'')+`${w.measuredTemp.toFixed(1)}°`;
      html+=`<td class="wx-meas">${measStr||'—'}</td>`;
      let diffStr='';
      if(w.measuredTWS!==null&&w.wind!==null){
        const d=w.measuredTWS-w.wind;const cls=d>0?'wx-diff-pos':'wx-diff-neg';
        diffStr+=`<span class="${cls}">${d>0?'+':''}${d.toFixed(1)}kn</span>`;
      }
      if(w.measuredTemp!==null&&w.temp!==null){
        const d=w.measuredTemp-w.temp;const cls=d>0?'wx-diff-pos':'wx-diff-neg';
        diffStr+=(diffStr?' · ':'')+`<span class="${cls}">${d>0?'+':''}${d.toFixed(1)}°</span>`;
      }
      html+=`<td>${diffStr||'—'}</td>`;
    }
    html+='</tr>';
  }
  html+='</table></div>';
  html+=`<div class="wx-note">${t('wxSource')}</div></div>`;
  panel.innerHTML=html;
}

function windArrow(deg){
  if(deg===null||deg===undefined)return'';
  const arrows=['↓','↙','←','↖','↑','↗','→','↘'];
  return arrows[Math.round(deg/45)%8];
}

/* ════════════════════════════════════════════════════
   LEAFLET MAP
   ════════════════════════════════════════════════════ */
function destroyMap(){if(leafletMap){leafletMap.remove();leafletMap=null;}}

function renderMap(track, events){
  leafletMap=L.map('map',{zoomControl:true,attributionControl:false});
  L.control.attribution({prefix:false,position:'bottomright'}).addTo(leafletMap);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM',maxZoom:18}).addTo(leafletMap);
  L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',{maxZoom:18,opacity:.8}).addTo(leafletMap);

  const coords=track.map(p=>[p.lat,p.lon]);
  const poly=L.polyline(coords,{color:'#4fc3f7',weight:3,opacity:.85}).addTo(leafletMap);

  const sogPts=track.filter(p=>p.sog!==null);
  if(sogPts.length>10){
    const mx=Math.max(...sogPts.map(p=>p.sog),1);
    for(let i=1;i<coords.length;i++){
      const sog=track[i].sog;
      if(sog!==null){
        const r=Math.min(sog/mx,1);
        L.polyline([coords[i-1],coords[i]],{
          color:`rgb(${0|79+r*176},${0|195-r*112},${0|247-r*167})`,weight:3,opacity:.85
        }).addTo(leafletMap);
      }
    }
  }

  L.circleMarker(coords[0],{radius:7,color:'#66bb6a',fillColor:'#66bb6a',fillOpacity:1,weight:0})
    .bindPopup(`<b>${t('start')}</b><br>${fmtTime(track[0].time)}`).addTo(leafletMap);
  L.circleMarker(coords[coords.length-1],{radius:7,color:'#ef5350',fillColor:'#ef5350',fillOpacity:1,weight:0})
    .bindPopup(`<b>${t('end')}</b><br>${fmtTime(track[track.length-1].time)}`).addTo(leafletMap);

  if(events&&events.length>0){
    const evColors={engine:'#ff9800',course:'#26c6da',wind:'#ab47bc',battery:'#ef5350'};
    for(const ev of events){
      if(!ev.time)continue;
      const evTime=new Date(ev.time).getTime();
      let closest=null,minDt=Infinity;
      for(const pt of track){if(!pt.time)continue;const dt=Math.abs(new Date(pt.time).getTime()-evTime);if(dt<minDt){minDt=dt;closest=pt;}}
      if(closest&&minDt<120000){
        const col=evColors[ev.type]||'#fdd835';
        L.circleMarker([closest.lat,closest.lon],{radius:5,color:col,fillColor:col,fillOpacity:.9,weight:1})
          .bindPopup(`<b>${fmtHM(ev.time)}</b><br>${ev.detail}`).addTo(leafletMap);
      }
    }
  }

  leafletMap.fitBounds(poly.getBounds().pad(.1));
}

/* ════════════════════════════════════════════════════
   LOG VIEWER
   ════════════════════════════════════════════════════ */
function renderLog(data){
  const info=document.getElementById('log-info');
  const box=document.getElementById('log-content');
  if(!data){box.innerHTML=`<div class="empty">${t('errorLoading')}</div>`;return;}
  info.textContent=data.filter
    ? t('linesOfFiltered',data.returnedLines.toLocaleString(),data.totalLines.toLocaleString(),data.filter)
    : t('linesOf',data.returnedLines.toLocaleString(),data.totalLines.toLocaleString());
  if(!data.lines.length){box.innerHTML=`<div class="empty">${t('noResults')}</div>`;return;}
  box.innerHTML=data.lines.map(l=>'<div class="ll">'+colorize(l)+'</div>').join('');
  box.scrollTop=box.scrollHeight;
}

async function applyF(fn){
  const filter=document.getElementById('fi').value;
  const lines=parseInt(document.getElementById('ln').value)||0;
  try{
    let u='/api/logs/'+fn+'?lines='+lines;
    if(filter)u+='&filter='+encodeURIComponent(filter);
    renderLog(await api(u));
  }catch(e){console.error(e);}
}

function toggleAuto(fn){
  const btn=document.getElementById('ar-btn');
  if(autoRefresh){stopAuto();btn.textContent='Auto ✕';btn.classList.remove('btn-green');}
  else{btn.textContent='Auto ✓';btn.classList.add('btn-green');
    autoRefresh=setInterval(()=>{applyF(fn);loadChips();},3000);}
}
function stopAuto(){if(autoRefresh){clearInterval(autoRefresh);autoRefresh=null;}}

function printReport(){
  // Set print header from current view
  const title=document.querySelector('.topbar-title');
  document.getElementById('print-title').textContent='NMEA0183 — '+(title?title.textContent:'Voyage');
  document.getElementById('print-sub').textContent='Printed '+new Date().toLocaleDateString()+' '+new Date().toLocaleTimeString();
  // Force Leaflet to redraw tiles before print
  if(leafletMap){
    leafletMap.invalidateSize();
    // Small delay to let tiles load
    setTimeout(()=>window.print(),400);
  } else {
    window.print();
  }
}

async function delFile(fn){
  if(!confirm(t('confirmDelete',fn)))return;
  try{
    const r=await fetch(API_SK+'/api/logs/'+fn,{method:'DELETE',credentials:'include'});
    if(r.status===401||r.status===403){alert(t('loginRequired'));return;}
    if(!r.ok){const txt=await r.text().catch(()=>'');alert(t('errorPrefix')+': '+r.status+' '+txt.substring(0,100));return;}
    showList();
  }catch(e){alert(t('errorPrefix')+': '+e.message);}
}

setInterval(loadChips,15000);
